<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market News — NSE AI</title>
  <meta name="description" content="Real-time Kenyan financial news with AI sentiment analysis for NSE stocks." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/auth.js"></script>
  <style>
    .news-page-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 1024px) {
      .news-page-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 768px) {
      .news-page-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .news-full-card {
        padding: 16px;
      }
    }
    .news-full-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px;
      display: flex; flex-direction: column; gap: 12px;
      transition: var(--transition);
      height: 100%;
    }
    .news-full-card:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow); }
    .news-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
    .news-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); color: var(--text-secondary);
      background: var(--bg-surface); transition: var(--transition); cursor: pointer;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent); color: var(--accent); background: var(--accent-glow2);
    }
    .sentiment-bar-track {
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.06);
      width: 100%;
      margin: 4px 0 8px 0;
      overflow: hidden;
    }
    .sentiment-score-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    .sentiment-score-bar.POSITIVE { background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }
    .sentiment-score-bar.NEGATIVE { background: linear-gradient(90deg, var(--red-dim), var(--red)); }
    .sentiment-score-bar.NEUTRAL  { background: var(--border-light); }

    /* Impact chips */
    .impact-section { margin-top: 4px; }
    .impact-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
      color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .impact-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .impact-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: default; position: relative; transition: var(--transition);
    }
    .impact-chip.POSITIVE {
      background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3);
      color: var(--accent);
    }
    .impact-chip.NEGATIVE {
      background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3);
      color: var(--red);
    }
    .impact-chip.NEUTRAL {
      background: var(--bg-surface); border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .impact-chip .chip-icon { font-size: 9px; }
    .impact-chip .chip-direct {
      font-size: 9px; opacity: 0.7; font-weight: 400;
    }
    .impact-tooltip {
      display: none; position: absolute; bottom: calc(100% + 6px); left: 0;
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: 8px; padding: 8px 12px; min-width: 200px; max-width: 280px;
      font-size: 11px; line-height: 1.5; color: var(--text-secondary);
      z-index: 50; box-shadow: var(--shadow);
    }
    .impact-chip:hover .impact-tooltip { display: block; }
    .conf-bar {
      height: 2px; border-radius: 1px; margin-top: 4px;
      background: rgba(255,255,255,0.08);
    }
    .conf-fill { height: 100%; border-radius: 1px; }
    .conf-fill.POSITIVE { background: var(--accent); }
    .conf-fill.NEGATIVE { background: var(--red); }
    .conf-fill.NEUTRAL  { background: var(--text-muted); }
    
    .news-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--text-muted); margin-top: auto;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <div class="nav-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M4 20L10 12L14 16L19 8L24 14" stroke="#00e5a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="14" r="2.5" fill="#00e5a0"/>
        </svg>
      </div>
      <span class="nav-title">NSE <span class="accent">AI</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="news.html"  class="nav-link active">News</a>
      <a href="stocks.html" class="nav-link">All Stocks</a>
    </div>
    <div class="nav-meta">
      <div id="nav-user-slot"></div>
      <div class="live-indicator"><span class="live-dot"></span>LIVE</div>
      <div class="nav-time" id="nav-time">--:--:-- EAT</div>
    </div>
  </nav>

  <main class="main">
    <section class="section">
      <div class="section-header">
        <h1 class="section-title">Market News <span class="ai-badge">AI SENTIMENT</span></h1>
      </div>

      <div class="news-filters" id="news-filters">
        <button class="filter-btn active" data-filter="ALL">All</button>
        <button class="filter-btn" data-filter="POSITIVE">🟢 Positive</button>
        <button class="filter-btn" data-filter="NEGATIVE">🔴 Negative</button>
        <button class="filter-btn" data-filter="NEUTRAL">⚪ Neutral</button>
        <button class="filter-btn" data-filter="Banking">Banking</button>
        <button class="filter-btn" data-filter="Telecommunications">Telecom</button>
        <button class="filter-btn" data-filter="Manufacturing">Manufacturing</button>
        <button class="filter-btn" data-filter="Consumer Staples">Consumer Staples</button>
        <button class="filter-btn" data-filter="Energy">Energy</button>
        <button class="filter-btn" data-filter="Insurance">Insurance</button>
        <button class="filter-btn" data-filter="Investment">Investment</button>
        <button class="filter-btn" data-filter="Agricultural">Agricultural</button>
      </div>

      <div class="news-page-grid" id="news-page-grid">
        <div class="news-full-card skeleton"></div>
        <div class="news-full-card skeleton"></div>
        <div class="news-full-card skeleton"></div>
        <div class="news-full-card skeleton"></div>
        <div class="news-full-card skeleton"></div>
        <div class="news-full-card skeleton"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">NSE <span class="accent">AI</span> — Nairobi Stock Intelligence</div>
      <div class="footer-disclaimer">⚠️ AI signals are for informational purposes only and do not constitute financial advice.</div>
      <div class="footer-meta">© 2025 NSE AI Platform · Built for Kenyan Investors</div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    let allArticles = [];
    let activeFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      // Auth guard — redirect to login if not authenticated
      if (!auth.requireAuth()) return;

      // Inject user dropdown into navbar
      (function injectUser() {
        const user = auth.getUser();
        if (!user) return;
        const slot = document.getElementById('nav-user-slot');
        if (!slot) return;
        const initials = user.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
        slot.innerHTML = `
          <div class="nav-user" id="nav-user-btn">
            ${user.avatar_url
              ? `<img src="${user.avatar_url}" class="nav-avatar" alt="${user.name}" />`
              : `<div class="nav-avatar-initials">${initials}</div>`}
            <span class="nav-user-name">${user.name.split(' ')[0]}</span>
            <span class="nav-chevron">▼</span>
            <div class="nav-dropdown">
              <div class="nav-dropdown-header">
                <div class="nav-dropdown-name">${user.name}</div>
                <div class="nav-dropdown-email">${user.email || ''}</div>
              </div>
              <div class="nav-dropdown-divider"></div>
              <button class="nav-dropdown-item danger" onclick="auth.logout()">
                <span>↩</span> Sign Out
              </button>
            </div>
          </div>`;

        // Toggle dropdown on click
        const btn = document.getElementById('nav-user-btn');
        btn.addEventListener('click', e => {
          e.stopPropagation();
          btn.classList.toggle('open');
        });
        // Close when clicking anywhere else
        document.addEventListener('click', () => btn.classList.remove('open'));
      })();

      // Clock
      const tick = () => {
        document.getElementById('nav-time').textContent =
          new Date().toLocaleTimeString('en-KE', { timeZone:'Africa/Nairobi', hour12:false }) + ' EAT';
      };
      tick(); setInterval(tick, 1000);

      // News and auto-refresh every 2 minutes
      const refreshNewsData = async () => {
        const data = await api.getNews();
        allArticles = data?.articles || MOCK.news;
        applyFilter();
      };
      await refreshNewsData();
      setInterval(refreshNewsData, 120_000);

      // Filters
      document.getElementById('news-filters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        applyFilter();
      });
    });

    const SECTOR_MAP = {
      'Banking': ['EQTY', 'KCB', 'COOP', 'ABSA', 'NCBA', 'STND', 'SBIC', 'HFCK', 'IMH', 'DTK'],
      'Telecommunications': ['SCOM'],
      'Manufacturing': ['BAMB', 'UNGA'],
      'Energy': ['KPLC', 'KEGN', 'TOTL'],
      'Consumer Staples': ['EABL', 'BAT'],
      'Insurance': ['KENR', 'JUB', 'BRIT', 'CIC'],
      'Investment': ['CTUM'],
      'Agricultural': ['KUKZ', 'SASN']
    };

    function applyFilter() {
      let filtered = allArticles;
      if (activeFilter === 'POSITIVE') filtered = allArticles.filter(a => a.sentiment?.label === 'POSITIVE');
      else if (activeFilter === 'NEGATIVE') filtered = allArticles.filter(a => a.sentiment?.label === 'NEGATIVE');
      else if (activeFilter === 'NEUTRAL') filtered = allArticles.filter(a => a.sentiment?.label === 'NEUTRAL');
      else if (activeFilter !== 'ALL') {
        const sectorTickers = SECTOR_MAP[activeFilter] || [activeFilter];
        filtered = allArticles.filter(a => {
          const directTickers = a.related_tickers || [];
          const impactTickers = (a.ticker_impacts || []).map(imp => imp.ticker);
          return sectorTickers.some(t => directTickers.includes(t) || impactTickers.includes(t));
        });
      }
      renderNews(filtered);
    }

    function renderNews(articles) {
      const grid = document.getElementById('news-page-grid');
      if (articles.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text-muted)">No articles match this filter.</div>';
        return;
      }
      grid.innerHTML = articles.map(a => {
        const sent  = a.sentiment || { label:'NEUTRAL', score:0.5, score_pct:'50%' };
        const width = Math.round((sent.score || 0.5) * 100);
        const impacts = a.ticker_impacts || [];

        const impactHTML = impacts.length ? `
          <div class="impact-section">
            <div class="impact-label">Stock Impact</div>
            <div class="impact-chips">
              ${impacts.slice(0, 6).map(imp => {
                const icon = imp.direction === 'POSITIVE' ? '▲' : imp.direction === 'NEGATIVE' ? '▼' : '●';
                const conf = Math.round(imp.confidence * 100);
                const badge = imp.is_direct ? '' : '<span class="chip-direct">spillover</span>';
                return `
                  <div class="impact-chip ${imp.direction}">
                    <span class="chip-icon">${icon}</span>
                    <span>${imp.ticker}</span>
                    ${badge}
                    <div class="impact-tooltip">
                      <strong>${imp.ticker} — ${imp.direction}</strong><br/>
                      ${imp.reason}<br/>
                      <div class="conf-bar"><div class="conf-fill ${imp.direction}" style="width:${conf}%"></div></div>
                      <span style="font-size:10px;color:var(--text-muted)">Confidence: ${conf}%${imp.is_direct ? '' : ' (sector spillover)'}</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        ` : '';

        const deepDiveHTML = impacts.length ? `
          <details class="news-deep-dive">
            <summary class="deep-dive-trigger">🤖 View AI Transmission Analysis</summary>
            <div class="deep-dive-content">
              ${impacts.map(imp => {
                const rel = Math.round((imp.relevance || 0.60) * 100);
                const sentencesHTML = (imp.matching_sentences || []).map(s => `
                  <blockquote class="deep-dive-quote">“${s}”</blockquote>
                `).join('') || '<div class="deep-dive-quote-none">Macro economic sector transmission. No direct textual mention.</div>';
                return `
                  <div class="deep-dive-row">
                    <div class="deep-dive-header">
                      <span class="deep-dive-ticker ${imp.direction}">${imp.ticker}</span>
                      <span class="deep-dive-badge channel">${imp.transmission_mechanism}</span>
                      <span class="deep-dive-badge relevance">${rel}% Relevance</span>
                    </div>
                    <div class="deep-dive-reason">${imp.reason}</div>
                    <div class="deep-dive-context">
                      <div class="context-label">Text Evidence:</div>
                      ${sentencesHTML}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </details>
        ` : '';

        return `
          <div class="news-full-card">
            <div class="news-source-row">
              <span class="news-source">${a.source}</span>
              <span class="sentiment-badge ${sent.label}">${sent.label} · ${sent.score_pct}</span>
            </div>
            <div class="sentiment-bar-track">
              <div class="sentiment-score-bar ${sent.label}" style="width:${width}%"></div>
            </div>
            <a href="${a.url}" target="_blank" rel="noopener" class="news-title" style="font-size:15px">${a.title}</a>
            ${a.summary ? `<div class="news-summary">${a.summary}</div>` : ''}
            ${impactHTML}
            ${deepDiveHTML}
            <div class="news-meta">
              <span>${a.published}</span>
              <div class="news-tickers">
                ${(a.related_tickers || []).map(t => `<span class="news-ticker-chip">${t}</span>`).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
